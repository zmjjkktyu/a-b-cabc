name: Build Theos Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo
          git checkout "$GITHUB_SHA"
          cp -r . ../workspace
          cd ..

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang perl unzip wget

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Build package
        run: |
          cd workspace
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: Find deb
        run: |
          find workspace -name "*.deb" -type f
