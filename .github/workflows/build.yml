name: Build Theos Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl sudo git make clang perl unzip wget xz-utils

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          cp -r /tmp/sdks/sdks-master/*.sdk "$HOME/theos/sdks/"

      - name: Check project
        run: |
          echo "=== Makefile ==="
          ls -l Makefile
          echo "=== Tweak.xm ==="
          ls -l Tweak.xm

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: Find deb
        run: |
          find . -name "*.deb" -type f
